sonar.projectKey=seven_days_to_die_auto_read_mod
sonar.projectName=7 Days to Die Auto-Read Mod
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=tests

sonar.language=cs
sonar.sourceEncoding=UTF-8

# Code coverage
sonar.cs.opencover.reportsPaths=coverage.xml
sonar.coverage.exclusions=**/*Tests.cs,**/Program.cs

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Coverage target
sonar.coverage.minimum=100
